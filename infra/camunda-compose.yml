# Camunda 8 Self-Managed, trimmed to what this comparison needs.
#
# Derived from the official lightweight compose file in camunda/camunda-distributions,
# with the Connectors bundle removed — this project talks to the broker with plain
# job workers, so the connector runtime is dead weight.
#
# Ports:
#   26500  Zeebe gRPC gateway (job workers connect here)
#   8088   REST API v2 + Operate + Tasklist UI  (http://localhost:8088/operate, /tasklist)
#   9600   Actuator / health
#   9200   Elasticsearch
#
# Auth is deliberately off (`unprotectedApi: true`) so the sample code stays
# focused on the saga rather than on OAuth plumbing. Web UI login is demo/demo.
services:
  orchestration: # Zeebe + Operate + Tasklist in one container
    image: camunda/camunda:8.8.35
    container_name: orchestration
    ports:
      - "26500:26500"
      - "9600:9600"
      - "8088:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 2s
      retries: 45
      start_period: 40s
    volumes:
      - camunda:/usr/local/camunda/data
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    networks:
      - camunda
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.2
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      # Quoted: bare OFF is parsed by YAML as the boolean false, which
      # Elasticsearch rejects as a log level and dies on startup.
      - logger.org.elasticsearch.deprecation="OFF"
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cat/health | grep -q green"]
      interval: 2s
      retries: 45
      start_period: 30s
      timeout: 2s
    volumes:
      - elastic:/usr/share/elasticsearch/data
    networks:
      - camunda

volumes:
  camunda:
  elastic:

networks:
  camunda:
    name: camunda

configs:
  orchestration-config:
    content: |
      management.endpoints.configprops.show-values: always
      camunda:
        system:
          cpu-thread-count: "3"
          io-thread-count: "3"
        security:
          authentication:
            method: "basic"
            unprotectedApi: true
          authorizations:
            enabled: false
          initialization:
            users:
              - username: "demo"
                password: "demo"
                name: "Demo User"
                email: "demo@demo.com"
            defaultRoles.admin.users:
              - "demo"
        database.index.numberOfReplicas: 0
        data:
          secondary-storage:
            type: elasticsearch
            elasticsearch:
              cluster-name: elasticsearch
              url: "http://elasticsearch:9200"
